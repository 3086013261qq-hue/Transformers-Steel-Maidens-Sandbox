name: Assemble Candidate5 card

on:
  push:
    paths:
      - 'build/cards/.candidate5-ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct Candidate5 PNG and JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cards qa
          cat build/cards/.candidate5.part*.b64 | base64 -d > /tmp/candidate5.png.xz
          echo 'ceb73f64577f448f05b5441c8bbe4635ff1d31020bcee4bec529c51b1c648f13  /tmp/candidate5.png.xz' | sha256sum -c -
          xz -dc /tmp/candidate5.png.xz > 'build/cards/变形钢姬_v1.0.0-candidate5.png'
          echo '27fddfa956b388363ec81e1d4b1c65b56cb23565a8a2a7e5f64338036827f58d  build/cards/变形钢姬_v1.0.0-candidate5.png' | sha256sum -c -
          python3 tools/extract_candidate5_json.py
          echo 'fd6ee660baa299812b5b42d53ba8422ac296fa1f17d9d55413b3b5ce401d4918  build/cards/变形钢姬_v1.0.0-candidate5.json' | sha256sum -c -
      - name: Commit final artifacts and remove transport chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/cards/.candidate5.part*.b64 build/cards/.candidate5-ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A build/cards qa/ .github/workflows/assemble-candidate5.yml tools/extract_candidate5_json.py
          git commit -m 'build: publish Steel Maidens Candidate5 final card'
          git push
